app = "sat-grinder"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  CLOUDFLARE_TUNNEL_ENABLED = "true"
  DATA_DIR = "/data"
  DATABASE_PATH = "/data/sat-grinder.sqlite"
  PORT = "3000"

[[mounts]]
  source = "sat_grinder_data"
  destination = "/data"

[checks.app_health]
  type = "http"
  port = 3000
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
